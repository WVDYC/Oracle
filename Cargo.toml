[package]
name = "waddington_gui_app"
version = "1.0.0"
edition = "2021"
authors = ["Altemir Zhilkibaev <altemirzhilkibaev@gmail.com>"]
description = "Native Desktop GUI Application (eframe/egui) for Waddington Epigenetic Landscapes, Phenotype Dynamics (M1, M2, M3), Custom CSV Analysis, and PNG Export"

[dependencies]
eframe = "0.22"
egui = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
image = "0.24"
csv = "1.3"
