[package]
name = "oracle"
version = "1.0.0"
edition = "2021"
authors = ["Altemir Zhilkibaev <altemirzhilkibaev@gmail.com>"]
description = "Oracle - Interactive Epigenetic Landscape & Macrophage Phenotype Dynamics Research Workstation (Rust / egui)"

[dependencies]
eframe = "0.22"
egui = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
image = "0.24"
csv = "1.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }
