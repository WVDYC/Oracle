name: Release Cross-Platform Binaries

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: oracle.exe
            asset_name: oracle-windows-x86_64.exe

          # macOS Apple Silicon (ARM64)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: oracle
            asset_name: oracle-macos-arm64

          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: oracle
            asset_name: oracle-linux-x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binary for Windows
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}

      - name: Build Windows Installer Wizard (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows/setup.iss
          Copy-Item installer/windows/Output/*.exe ./

      - name: Prepare Binary for Unix
        if: matrix.os != 'windows-latest'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} ./${{ matrix.asset_name }}
          chmod +x ./${{ matrix.asset_name }}

      - name: Package macOS Application (.app bundle in .zip)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p "Oracle.app/Contents/MacOS"
          mkdir -p "Oracle.app/Contents/Resources"
          cp target/${{ matrix.target }}/release/oracle "Oracle.app/Contents/MacOS/oracle"
          chmod +x "Oracle.app/Contents/MacOS/oracle"
          cp assets/icon.png "Oracle.app/Contents/Resources/icon.png"
          cat << 'EOF' > "Oracle.app/Contents/Info.plist"
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>oracle</string>
              <key>CFBundleIconFile</key>
              <string>icon.png</string>
              <key>CFBundleIdentifier</key>
              <string>com.wvdyc.oracle</string>
              <key>CFBundleName</key>
              <string>Oracle</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0.0</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          EOF
          zip -r "oracle-macos-arm64.zip" "Oracle.app"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ./${{ matrix.asset_name }}

      - name: Upload macOS Zip Bundle
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-macos-zip
          path: ./oracle-macos-arm64.zip

      - name: Upload Windows Installer Wizard Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: oracle-windows-installer
          path: ./Oracle-*-Windows-Setup-x64.exe

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets

      - name: Display downloaded assets
        run: ls -R release_assets

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Oracle v1.0.0 — Epigenetic Landscape & Phenotype Workstation"
          files: |
            release_assets/*/*
          generate_release_notes: true
